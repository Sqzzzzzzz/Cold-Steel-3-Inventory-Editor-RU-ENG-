name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install Pillow 'pyinstaller>=6,<7' pefile

      - name: Extract the real Tk feather icon (no downloading)
        shell: pwsh
        run: python tools/extract_tk_icon.py icons/app_icon.ico

      - name: Build Windows EXE with feather icon
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --add-data 'icons;icons' `
            --icon 'icons/app_icon.ico' `
            --name CS3_Inventory_Editor_Feather app.py

      - name: Verify EXE contains icon resources
        shell: pwsh
        run: python tools/extract_tk_icon.py --verify-exe dist/CS3_Inventory_Editor_Feather.exe icons/app_icon.ico

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: CS3-Inventory-Editor-Feather-Windows
          path: dist/CS3_Inventory_Editor_Feather.exe
          if-no-files-found: error
