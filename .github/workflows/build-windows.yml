name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install Pillow 'pyinstaller>=6,<7'

      - name: Get original Tk feather icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path icons | Out-Null
          $url = 'https://raw.githubusercontent.com/tcltk/tk/core-8-6-branch/win/rc/tk.ico'
          Invoke-WebRequest -Uri $url -OutFile 'icons/app_icon.ico' -ErrorAction Stop
          $bytes = [System.IO.File]::ReadAllBytes('icons/app_icon.ico')
          if ($bytes.Length -lt 128 -or $bytes[0] -ne 0 -or $bytes[1] -ne 0 -or $bytes[2] -ne 1 -or $bytes[3] -ne 0) {
            throw 'Downloaded icon is missing or is not a valid ICO file.'
          }

      - name: Build EXE with feather icon
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --add-data 'icons;icons' `
            --icon 'icons/app_icon.ico' `
            --name CS3_Inventory_Editor app.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: CS3-Inventory-Editor-Windows
          path: dist/CS3_Inventory_Editor.exe
          if-no-files-found: error
