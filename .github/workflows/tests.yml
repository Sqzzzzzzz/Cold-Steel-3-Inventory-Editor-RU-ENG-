name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system GUI test support
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk libegl1 libopengl0 libxkbcommon-x11-0
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests with virtual display
        run: xvfb-run -a python -X faulthandler -m pytest -v --tb=short
